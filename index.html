<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parvathy Krishnan | UI/UX Designer</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        script: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        background: '#0f172a', // slate-950
                        surface: '#1e293b', // slate-800
                        primary: '#00E5FF', // Bright Cyan
                        secondary: '#14B8A6', // Teal-500
                        accent: '#22D3EE', // Cyan-400
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Hide Scrollbar Utility */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animation Utilities */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Typing Animation */
        .typing::after {
            content: '|';
            animation: blink 1s step-start infinite;
            color: #00E5FF;
            margin-left: 4px;
        }

        .typing-done::after {
            content: '';
            animation: none;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Icon Micro-interactions */
        .icon-enter {
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon-enter.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Primary Button Animation */
        .btn-primary-animate {
            background-image: linear-gradient(to right, #00E5FF 0%, #14B8A6 51%, #00E5FF 100%);
            background-size: 200% auto;
            transition: 0.5s;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .btn-primary-animate:hover {
            background-position: right center;
            color: #0f172a;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
            transform: translateY(-2px) scale(1.05);
        }

        .btn-primary-animate:active {
            transform: scale(0.95);
        }

        /* Desktop Accordion Styles */
        @media (min-width: 768px) {
            .accordion-card {
                flex: 1;
                transition: flex 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, filter 0.3s ease;
            }

            .accordion-container:hover .accordion-card {
                opacity: 0.5;
                filter: blur(1px);
            }

            .accordion-container .accordion-card:hover {
                flex: 3;
                /* Expand factor on desktop */
                opacity: 1;
                filter: blur(0px);
            }
        }

        /* Mobile Focus/Touch Styles */
        .accordion-card:focus {
            outline: none;
        }

        /* Smooth transform for the scroll track */
        #projects-track {
            will-change: transform;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
</head>

<body class="antialiased overflow-x-hidden">

    <!-- Navbar -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 py-6">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="#" id="nav-brand"
                class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-accent">
                <!-- Populated by JS -->
            </a>

            <!-- Desktop Menu -->
            <div id="nav-desktop" class="hidden md:flex items-center gap-8">
                <!-- Links populated by JS -->
            </div>

            <!-- Mobile Toggle -->
            <button id="mobile-toggle" class="md:hidden text-slate-300 hover:text-white">
                <i data-lucide="menu"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu"
            class="hidden md:hidden bg-surface border-b border-slate-800 absolute w-full left-0 top-full shadow-xl">
            <div id="nav-mobile-links" class="flex flex-col p-6 gap-4">
                <!-- Links populated by JS -->
            </div>
        </div>
    </nav>

    <!-- Hero Section (Sticky) -->
    <section id="hero"
        class="sticky top-0 flex items-center justify-center pt-20 md:pt-32 md:h-screen overflow-hidden z-0">
        <!-- Background Gradients -->
        <div class="absolute top-0 right-0 w-1/2 h-1/2 bg-primary/10 rounded-full blur-[120px] -z-10 animate-pulse">
        </div>
        <div class="absolute bottom-0 left-0 w-1/3 h-1/3 bg-secondary/10 rounded-full blur-[100px] -z-10"></div>

        <div class="container mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
            <div class="reveal">
                <div id="hero-badge"
                    class="hidden md:inline-block px-4 py-2 rounded-full bg-surface border border-slate-700 text-primary text-sm font-medium mb-6">
                    <!-- JS -->
                </div>
                <h1 id="hero-title" class="text-3xl md:text-6xl font-bold leading-tight mb-6">
                    <!-- JS -->
                </h1>
                <p id="hero-desc" class="text-slate-400 text-sm md:text-md mb-8 max-w-lg leading-relaxed">
                    <!-- JS -->
                </p>
                <div class="flex flex-wrap gap-2 md:gap-4">
                    <a id="hero-btn-secondary" href="./assets/CV -Parvathy K Krishnan.pdf" download
                        class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full font-medium transition-all duration-300 transform hover:scale-105 active:scale-95 bg-surface text-white border border-slate-700 hover:border-primary hover:text-primary">
                        <!-- JS -->
                    </a>
                </div>
            </div>

            <div class="reveal relative delay-200 pb-20">
                <div id="hero-image-container" class="relative aspect-square max-w-md mx-auto">
                    <!-- Abstract circular frame -->
                    <div
                        class="absolute inset-0 border-2 border-slate-800 rounded-full animate-[spin_10s_linear_infinite]">
                    </div>
                    <div
                        class="absolute inset-4 border border-slate-700 rounded-full animate-[spin_15s_linear_infinite_reverse]">
                    </div>

                    <img id="hero-image" src="" alt="Portrait" class="rounded-full w-full h-full object-cover p-8" />

                    <!-- Floating Badges Container -->
                    <div id="hero-badges">
                        <!-- JS Populated -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Wrapper (Slides over Hero) -->
    <div id="main-content" class="relative z-10 bg-background shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">

        <!-- About Section -->
        <section id="about" class="py-24 md:py-52 bg-surface/30">
            <div class="container mx-auto px-6">
                <div class="max-w-4xl mx-auto reveal">
                    <h2 id="about-title" class="text-3xl font-bold mb-8 flex items-center gap-4">
                        <!-- JS -->
                    </h2>
                    <div class="grid md:grid-cols-2 gap-12 items-center">
                        <div id="about-text" class="space-y-6 text-slate-300 leading-relaxed">
                            <!-- JS populated paragraphs -->
                        </div>

                        <!-- Icon Grid -->
                        <div
                            class="bg-surface/50 rounded-3xl p-8 border border-slate-800 flex items-center justify-center">
                            <div id="about-grid" class="grid grid-cols-2 gap-8 text-center">
                                <!-- JS populated icons -->
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

        <!-- Projects Section (Scroll-Linked Animation) -->
        <section id="projects" class="relative bg-background py-20 md:p-0">
            <div id="projects-sticky"
                class="w-full md:h-screen md:sticky md:top-0 md:overflow-hidden flex flex-col bg-background z-20">

                <div class="container mx-auto px-6 py-8 md:pt-28 md:pb-8 flex-none reveal z-30">
                    <h2 id="projects-title" class="text-4xl md:text-6xl font-bold mb-4"></h2>
                    <p class="text-slate-400 max-w-xl text-lg">
                        <span id="projects-desc"></span>
                        <span id="projects-hint-desktop" class="hidden md:inline"></span>
                        <span id="projects-hint-mobile" class="md:hidden"></span>
                    </p>
                </div>

                <div id="projects-track"
                    class="flex-1 flex gap-6 px-6 md:px-[10vw] items-center overflow-x-auto md:overflow-visible w-full md:w-max snap-x snap-mandatory md:snap-none scrollbar-hide pb-12 md:pb-0">
                    <!-- JS populated Cards -->
                </div>
            </div>
        </section>

        <!-- Experience / Journey Section -->
        <section id="journey" class="py-24 md:py-52 bg-surface/20">
            <div class="container mx-auto px-6 max-w-6xl">
                <div class="text-center mb-16 reveal">
                    <span id="journey-badge"
                        class="flex flex-col text-primary text-sm font-semibold tracking-wider uppercase"></span>
                    <h2 id="journey-title" class="text-4xl font-bold mt-2 inline-block"></h2>
                    <p class="text-slate-400 mt-2 text-sm flex items-center justify-center gap-2">
                        <i data-lucide="mouse-pointer-click" class="w-4 h-4"></i>
                    </p>
                </div>

                <!-- Accordion Container -->
                <div id="journey-list" class="accordion-container flex flex-col md:flex-row gap-4 w-full h-auto reveal">
                    <!-- JS populated Accordion -->
                </div>

            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="py-24 md:py-48 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent pointer-events-none"></div>

            <div class="container mx-auto px-6 relative z-10">
                <div class="reveal rounded-3xl p-6 md:p-16 text-center max-w-4xl mx-auto">
                    <h2 id="contact-title" class="text-4xl md:text-5xl font-bold mb-6"></h2>
                    <p id="contact-desc" class="text-slate-400 text-lg mb-10 max-w-2xl mx-auto"></p>

                    <div class="flex flex-col md:flex-row justify-center gap-8 mb-12">
                        <div id="contact-email"
                            class="flex justify-center gap-3 p-4 bg-background rounded-xl border border-slate-800 hover:border-primary hover:text-primary transition-colors group">
                            <i data-lucide="mail"
                                class="w-6 h-6 text-slate-400 group-hover:text-primary transition-colors"></i>
                            <span class="text-slate-300 group-hover:text-white transition-colors"></span>
                        </div>
                        <div class="flex justify-center gap-3 p-4 bg-background rounded-xl border border-slate-800">
                            <i data-lucide="phone" class="w-6 h-6 text-slate-400"></i>
                            <span id="contact-phone" class="text-slate-300"></span>
                        </div>
                        <div class="flex justify-center gap-3 p-4 bg-background rounded-xl border border-slate-800">
                            <i data-lucide="map-pin" class="w-6 h-6 text-slate-400"></i>
                            <span id="contact-location" class="text-slate-300"></span>
                        </div>
                    </div>

                    <div id="contact-socials" class="flex justify-center gap-4">
                        <!-- JS populated -->
                    </div>

                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="py-8 bg-black border-t border-slate-800 text-center">
            <div class="container mx-auto px-6">
                <div class="mb-4">
                    <span id="footer-brand" class="text-2xl font-bold font-script text-white"></span>
                </div>
                <p class="text-slate-500 text-sm">
                    © <span id="year"></span> <span id="footer-copy"></span>. All rights reserved.
                </p>
            </div>
        </footer>

    </div> <!-- End Main Content Wrapper -->

    <!-- Main Logic Script -->
    <script type="module">
        async function init() {
            try {
                const response = await fetch('content.json');
                const data = await response.json();
                renderApp(data);

                // Re-initialize icons after DOM update
                lucide.createIcons();

                // Initialize logic that depends on DOM
                setupNavbar();
                setupScrollLogic();
                setupActiveLinkObserver();
                setupAnimations();

            } catch (error) {
                console.error("Failed to load content:", error);
            }
        }

        function renderApp(data) {
            // --- General & Navbar ---
            document.getElementById('nav-brand').textContent = data.general.name;
            document.getElementById('footer-brand').textContent = data.general.name;
            document.getElementById('footer-copy').textContent = data.general.name;
            document.getElementById('year').textContent = new Date().getFullYear();

            const navDesktop = document.getElementById('nav-desktop');
            const navMobile = document.getElementById('nav-mobile-links');
            const hireBtn = `<a href="#contact" class="px-5 py-2 rounded-full bg-surface border border-slate-700 hover:border-primary text-white text-md font-medium transition-colors">Get in Touch</a>`;

            let navHtml = '';
            data.navbar.forEach(link => {
                navHtml += `<a href="${link.href}" class="nav-link text-slate-300 hover:text-primary transition-colors text-md font-medium">${link.label}</a>`;
            });

            navDesktop.innerHTML = navHtml + hireBtn;

            let mobileHtml = '';
            data.navbar.forEach(link => {
                mobileHtml += `<a href="${link.href}" class="mobile-link text-slate-300 hover:text-primary text-lg">${link.label}</a>`;
            });
            mobileHtml += `<a href="#contact" class="mobile-link text-primary text-lg">Contact</a>`;
            navMobile.innerHTML = mobileHtml;


            // --- Hero ---
            document.getElementById('hero-badge').textContent = data.hero.badge;
            document.getElementById('hero-title').innerHTML = `${data.hero.titlePrefix} <br /> <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary via-secondary to-accent">${data.hero.titleHighlight}</span> ${data.hero.titleSuffix}`;
            document.getElementById('hero-desc').textContent = data.hero.description;
            // document.getElementById('hero-btn-primary').innerHTML = `${data.hero.buttons.primary} <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
            document.getElementById('hero-btn-secondary').innerHTML = `${data.hero.buttons.secondary} <i data-lucide="download" class="w-4 h-4"></i>`;
            document.getElementById('hero-image').src = data.hero.image;

            // Render Floating Badges
            if (data.hero.floatingBadges) {
                document.getElementById('hero-badges').innerHTML = data.hero.floatingBadges.map(badge => `
                <div class="absolute ${badge.position} bg-surface/90 backdrop-blur border border-slate-700 p-3 md:p-4 rounded-xl shadow-xl flex items-center gap-3 ${badge.animation}" style="animation-duration: 3s;">
                    ${badge.icon ? `<div class="p-2 bg-primary/10 rounded-full text-primary"><i data-lucide="${badge.icon}" class="w-5 h-5"></i></div>` : ''}
                    <div>
                        <span class="block text-sm md:text-xl font-bold text-white leading-tight">${badge.value}</span>
                        <span class="block text-xs text-slate-400">${badge.label}</span>
                    </div>
                </div>
            `).join('');
            }

            // --- About ---
            // Typing Effect Setup
            document.getElementById('about-title').innerHTML = `<span class="w-12 h-[2px] bg-primary inline-block align-middle mr-4"></span><span data-type-text="${data.about.title}"></span>`;

            document.getElementById('about-text').innerHTML = data.about.description.map(p => `<p>${p}</p>`).join('');

            // Icon Grid with Pop-in Animation
            document.getElementById('about-grid').innerHTML = data.about.iconGrid.map((item, index) => `
            <div class="flex flex-col items-center icon-enter" style="transition-delay: ${index * 150}ms">
                <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center mb-4 border border-slate-700 group hover:scale-110 hover:border-primary hover:shadow-lg hover:shadow-primary/20 transition-all duration-300 cursor-pointer">
                        <i data-lucide="${item.icon}" class="w-8 h-8 ${item.color} group-hover:scale-110 transition-transform"></i>
                </div>
                <span class="text-slate-300 font-medium">${item.label}</span>
            </div>
        `).join('');

            // --- Projects ---
            document.getElementById('projects-title').innerHTML = `<span data-type-text="${data.projects.title}"></span>`;
            document.getElementById('projects-desc').textContent = data.projects.subtitle;
            document.getElementById('projects-hint-desktop').textContent = data.projects.scrollHint.desktop;
            document.getElementById('projects-hint-mobile').textContent = data.projects.scrollHint.mobile;

            const projectsTrack = document.getElementById('projects-track');
            let projectsHtml = data.projects.items.map((p, idx) => `
          <div class="snap-center shrink-0 w-[85vw] md:w-[60vw] h-[60vh] md:h-[70vh] relative rounded-[2.5rem] overflow-hidden group border border-slate-800 bg-surface shadow-2xl shadow-black/50 reveal ${idx > 0 ? `delay-${idx * 100}` : ''}">
            <div class="absolute inset-0 bg-slate-900/10 z-10 transition-colors group-hover:bg-transparent pointer-events-none"></div>
            <img src="${p.image}" alt="${p.title}" draggable="false" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
            <div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent p-8 md:p-16 flex flex-col justify-end z-20 pointer-events-none">
               <div class="transform transition-transform duration-500 translate-y-4 group-hover:translate-y-0 pointer-events-auto">
                 <div class="flex items-center gap-3 mb-4">
                   <span class="px-4 py-1 rounded-full border border-${p.categoryColor}/30 bg-${p.categoryColor}/10 text-${p.categoryColor} text-xs font-semibold uppercase tracking-wider backdrop-blur-md">${p.category}</span>
                 </div>
                 <h3 class="text-4xl md:text-6xl font-bold text-white mb-4 leading-tight">${p.title}</h3>
                 <p class="text-slate-300 max-w-lg mb-8 text-lg line-clamp-2 md:line-clamp-none">${p.description}</p>
                 <a href="${p.link}" class="inline-flex items-center gap-2 text-white font-medium hover:text-${p.categoryColor} transition-colors group/btn relative z-30 p-2 -ml-2">
                   View Case Study <i data-lucide="arrow-right" class="w-5 h-5 transition-transform group-hover/btn:translate-x-1"></i>
                 </a>
               </div>
            </div>
          </div>
        `).join('');

            projectsHtml += `
          <div class="snap-center shrink-0 w-[85vw] md:w-[30vw] h-[60vh] md:h-[70vh] relative rounded-[2.5rem] overflow-hidden group border border-dashed border-slate-700 bg-surface/20 flex flex-col items-center justify-center text-center p-8 hover:bg-surface/40 transition-colors cursor-pointer">
              <div class="bg-primary/10 p-4 rounded-full mb-6 group-hover:scale-110 transition-transform duration-300">
                  <i data-lucide="layers" class="w-8 h-8 text-primary"></i>
              </div>
              <h3 class="text-2xl font-bold text-white mb-2">${data.projects.archive.title}</h3>
              <p class="text-slate-400 mb-8 max-w-xs">${data.projects.archive.description}</p>
              <a href="https://dribbble.com/Parvathykk97" target="_blank" class="px-8 py-3 rounded-full btn-primary-animate text-slate-900 font-bold">
                  ${data.projects.archive.button}
              </a>
          </div>
        `;
            projectsTrack.innerHTML = projectsHtml;

            // --- Journey ---
            document.getElementById('journey-badge').textContent = data.journey.badge;
            document.getElementById('journey-title').innerHTML = `<span data-type-text="${data.journey.title}"></span>`;
            document.getElementById('journey-list').innerHTML = data.journey.items.map(job => `
             <div tabindex="0" class="accordion-card group relative bg-surface border border-slate-700 hover:border-${job.color} focus:border-${job.color} rounded-3xl overflow-hidden cursor-pointer outline-none">
                    <div class="absolute inset-0 bg-gradient-to-b from-${job.color}/5 to-transparent opacity-0 group-hover:opacity-100 group-focus:opacity-100 transition-opacity duration-500"></div>
                    <div class="h-full p-8 flex flex-col relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-${job.color}/10 text-${job.color} text-xs px-3 py-1 rounded-full font-medium whitespace-nowrap">${job.year}</span>
                            <div class="p-2 bg-slate-800 rounded-full text-${job.color} group-hover:bg-${job.color} group-hover:text-slate-900 group-focus:bg-${job.color} group-focus:text-slate-900 transition-colors">
                                <i data-lucide="${job.icon}" class="w-5 h-5"></i>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-2xl font-bold text-white group-hover:text-${job.color} group-focus:text-${job.color} transition-colors whitespace-nowrap overflow-hidden text-ellipsis">${job.role}</h3>
                            <p class="text-slate-400 text-sm mt-1">${job.company}</p>
                        </div>
                        <div class="mt-4 max-h-0 opacity-0 overflow-hidden group-hover:max-h-[500px] group-hover:opacity-100 group-focus:max-h-[500px] group-focus:opacity-100 transform translate-y-4 group-hover:translate-y-0 group-focus:translate-y-0 transition-all duration-500 ease-in-out">
                            <div class="w-full h-[1px] bg-slate-700 mb-4 hidden md:block"></div>
                            <ul class="space-y-3 text-slate-300 text-sm">
                                ${job.details.map(d => `
                                    <li class="flex items-start gap-3">
                                        <div class="w-1.5 h-1.5 rounded-full bg-${job.color} mt-1.5 shrink-0"></div>
                                        <span class="line-clamp-none">${d}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
        `).join('');

            // --- Contact ---
            document.getElementById('contact-title').innerHTML = `<span data-type-text="${data.contact.title}"></span>`;
            document.getElementById('contact-desc').textContent = data.contact.description;

            const emailLink = document.getElementById('contact-email');
            emailLink.href = `mailto:${data.general.email}`;
            emailLink.querySelector('span').textContent = data.general.email;

            document.getElementById('contact-phone').textContent = data.general.phone;
            document.getElementById('contact-location').textContent = data.general.location;

            document.getElementById('contact-socials').innerHTML = data.general.socials.map(s => `
             <a href="${s.url}" class="p-3 bg-slate-800 rounded-full text-primary hover:bg-primary hover:text-slate-900 transition-colors">
                   <i data-lucide="${s.platform}" class="w-6 h-6"></i>
             </a>
        `).join('');
        }

        function setupNavbar() {
            const navbar = document.getElementById('navbar');
            const mobileToggle = document.getElementById('mobile-toggle');
            const mobileMenu = document.getElementById('mobile-menu');
            const mobileLinks = document.querySelectorAll('.mobile-link');

            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('bg-background/90');
                } else {
                    navbar.classList.remove('bg-background/90');
                }
            });

            mobileToggle.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                const icon = mobileMenu.classList.contains('hidden') ? 'menu' : 'x';
                mobileToggle.innerHTML = `<i data-lucide="${icon}"></i>`;
                lucide.createIcons();
            });

            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                    mobileToggle.innerHTML = `<i data-lucide="menu"></i>`;
                    lucide.createIcons();
                });
            });
        }

        function setupScrollLogic() {
            const projectSection = document.getElementById('projects');
            const stickyContainer = document.getElementById('projects-sticky');
            const track = document.getElementById('projects-track');

            function handleHorizontalScroll() {
                if (!track || !projectSection) return;

                if (window.innerWidth >= 768) {
                    const trackWidth = track.scrollWidth;
                    const viewportWidth = window.innerWidth;
                    const scrollDistance = trackWidth - viewportWidth;

                    projectSection.style.height = `${scrollDistance + window.innerHeight}px`;

                    const rect = projectSection.getBoundingClientRect();
                    const distFromTop = -rect.top;
                    const percentScrolled = distFromTop / scrollDistance;

                    let safePercent = Math.min(1, Math.max(0, percentScrolled));
                    track.style.transform = `translateX(-${safePercent * scrollDistance}px)`;
                } else {
                    projectSection.style.height = 'auto';
                    track.style.transform = 'none';
                }
            }

            window.addEventListener('scroll', handleHorizontalScroll);
            window.addEventListener('resize', handleHorizontalScroll);
            setTimeout(handleHorizontalScroll, 200); // Trigger once after render
        }

        function setupActiveLinkObserver() {
            const sections = document.querySelectorAll('section');
            const navLinks = document.querySelectorAll('.nav-link, .mobile-link');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');

                        navLinks.forEach(link => {
                            const href = link.getAttribute('href');
                            // Handle "Home" link which might be "#" or "#navbar" or "#hero"
                            // and ensure we match the current section id
                            if (href === `#${id}` || (id === 'hero' && href === '#')) {
                                link.classList.add('text-primary', 'font-bold');
                                link.classList.remove('text-slate-300');
                            } else {
                                link.classList.remove('text-primary', 'font-bold');
                                link.classList.add('text-slate-300');
                            }
                        });
                    }
                });
            }, {
                threshold: 0.2, // Trigger when 20% of section is visible
                rootMargin: "-10% 0px -50% 0px" // Adjust detection area to be more central
            });

            sections.forEach(section => {
                observer.observe(section);
            });
        }

        function setupAnimations() {
            // Observer for standard fade-up
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

            document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

            // Observer for Typing Effect
            const typingObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const text = el.getAttribute('data-type-text');

                        if (text && !el.classList.contains('typing-done')) {
                            el.classList.add('typing');
                            let i = 0;
                            el.textContent = '';

                            function type() {
                                if (i < text.length) {
                                    el.textContent += text.charAt(i);
                                    i++;
                                    setTimeout(type, 80); // Typing speed
                                } else {
                                    el.classList.remove('typing');
                                    el.classList.add('typing-done');
                                }
                            }
                            type();
                        }
                        typingObserver.unobserve(el);
                    }
                });
            }, { threshold: 1.0 });

            document.querySelectorAll('[data-type-text]').forEach(el => typingObserver.observe(el));

            // Observer for Icon Pop-in
            const iconObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                        iconObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.2 });

            document.querySelectorAll('.icon-enter').forEach(el => iconObserver.observe(el));
        }

        // Initialize Application
        init();

    </script>
</body>
